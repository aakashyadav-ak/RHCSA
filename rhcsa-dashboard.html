<title>RHCSA Study Dashboard</title>
<style>
:root{--bg:#eef2f5;--card:#fff;--ink:#12263a;--mute:#5d6f80;--line:#d5dde4;--track:#c3cfda;--ok:#12805c;--accent:#0f7b8a;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0e1822;--card:#16232f;--ink:#e8eef3;--mute:#8da0b1;--line:#27394a;--track:#33485b;--ok:#3cc790;--accent:#4fc3d2;color-scheme:dark}}
/* ===== HERO COLOURS: edit these 4 lines to restyle the top banner ===== */
:root{--hero-bg:#12263a;--hero-text:#f3f6f8;--hero-mute:#b9c7d3;--hero-box:#1f3b56}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px;background-attachment:fixed}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 64px}
h1,h2,h3{font-family:Rockwell,"Roboto Slab",Georgia,serif;margin:0}
.hero{display:flex;gap:28px;align-items:center;flex-wrap:wrap;background:var(--hero-bg);color:var(--hero-text);border-radius:18px;padding:28px}
.hero h1{font-size:clamp(26px,4vw,38px);line-height:1.15}
.hero p{margin:6px 0 0;color:var(--hero-mute);max-width:46ch}
.ring{position:relative;width:150px;height:150px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 34px Rockwell,Georgia,serif}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;flex:1;min-width:260px}
.stat{background:var(--hero-box);border-radius:12px;padding:12px 14px}
.stat b{display:block;font:700 26px Rockwell,Georgia,serif}
.stat span{font-size:13px;color:var(--hero-mute)}
.next{margin:18px 0;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:12px;padding:14px 18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0}
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tabs button{border:0;background:none;color:var(--ink);padding:9px 16px;font:inherit;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
input[type=search]{flex:1;min-width:160px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.group{margin:28px 0}
.ghead{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.gicon{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:var(--c);flex:none;box-shadow:0 0 0 3px var(--card)}
.ghead h2{font-size:21px}
.ghead small{color:var(--mute);display:block}
.gmeter{margin-left:auto;text-align:right;min-width:130px;font-size:13px;color:var(--mute)}
.track{height:11px;background:var(--track);border-radius:9px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.fill{height:100%;background:var(--c,var(--accent));width:0;transition:width .35s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:14px;padding:14px 16px}
.card.done{border-color:var(--ok);border-top-color:var(--ok)}
.chead{display:flex;gap:10px;align-items:flex-start}
.num{font:700 22px Rockwell,Georgia,serif;color:var(--c);min-width:34px}
.card h3{font-size:16px;line-height:1.3}
.badge{margin-left:auto;font-size:12px;border-radius:20px;padding:2px 10px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.card.done .badge{background:var(--ok);border-color:var(--ok);color:#fff}
.card .track{margin:10px 0 6px}
details summary{cursor:pointer;color:var(--mute);font-size:14px;padding:4px 0}
ul{list-style:none;margin:6px 0 0;padding:0}
li label{display:flex;gap:8px;align-items:flex-start;padding:4px 0;cursor:pointer;font-size:14.5px}
li input{margin-top:4px;accent-color:var(--ok);width:16px;height:16px;flex:none}
li input:checked+span{color:var(--mute);text-decoration:line-through}
.lab{font-size:11px;color:#fff;font-style:normal;background:var(--c);border-radius:6px;padding:0 6px;margin-left:6px}
.foot{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13.5px}
.foot a{color:var(--accent);font-weight:600}
.foot label{display:flex;gap:6px;align-items:center;cursor:pointer;color:var(--mute)}
.empty{padding:30px;text-align:center;color:var(--mute)}
@media(prefers-reduced-motion:reduce){.fill{transition:none}}
.bk{display:block;font:600 11px system-ui;letter-spacing:.05em;color:var(--mute)}
.sub{margin-left:24px}
.sub small{font-size:12px}
.btn[aria-pressed=true]{background:var(--ink);color:var(--bg)}

const PG={"a1":["rh124-ch01"],"a2":["rh124-ch02"],"a3":["rh124-ch03"],"a6":["rh124-ch06","rh124-ch06-07"],"a7":["rh124-ch06-07"],"a8":["rh124-ch08-09"],"a9":["rh124-ch08-09"],"a10":["rh124-ch10"],"a11":["rh124-ch11"],"a15":["rh124-ch15"],"a16":["rh124-ch16"],"a17":["rh124-ch17-18"],"a18":["rh124-ch17-18"],"a19":["rh124-ch19"],"b1":["rh134-ch01"],"b2":["rh134-ch02"],"b3":["rh134-ch03"],"b4":["rh134-ch04"],"b5":["rh134-ch05"],"b6":["rh134-ch06"],"b7":["rh134-ch07"],"b8":["rh134-ch08"],"b9":["rh134-ch09"],"b10":["rh134-ch10"],"b11":["rh134-ch11"],"b12":["rh134-ch12"],"b13":["rh134-ch13"],"b14":["rh134-ch14"],"b15":["rh134-ch15"],"b16":["rh134-ch16"],"b17":["rh134-ch17"],"b18":["rh134-ch18"]};
const KEY="rhcsa-progress-v1",BN={a:"RH124",b:"RH134"};let S={t:{}},view="topic",bk="all",hot=false,hx=false,term="";
try{S=Object.assign(S,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},$=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
const flag=s=>"!~".includes(s[0])?s[0]:"",nm=s=>flag(s)?s.slice(1):s;
const ids=n=>CH[n][1].flatMap((tp,i)=>tp.s.length?tp.s.map((_,j)=>n+"|"+i+"|"+j):[n+"|"+i]);
const done=n=>ids(n).filter(k=>S.t[k]).length,isLab=t=>/^(Lab|Quiz)/.test(t),gOf=n=>GROUPS.find(g=>g.ch.includes(n));
const inBk=n=>bk=="all"||n[0]==bk,ALL=Object.keys(CH);
const link=n=>PG[n].map((f,i,a)=>`<a href="chapters/${f}.html">Open notes${a.length>1?" "+(i+1):""}</a>`).join(" · ");
function li(n,i,tp){
 if(!tp.s.length){const k=n+"|"+i;return `<li><label><input type="checkbox" data-t="${k}"${S.t[k]?" checked":""}><span>${esc(tp.t)}</span>${isLab(tp.t)?'<em class="lab">practice</em>':""}</label></li>`}
 const subs=tp.s.map((s,j)=>[s,j]).filter(([s])=>(!hot||flag(s)=="!")&&(!hx||flag(s)!="~"));
 if(!subs.length)return "";
 const all=tp.s.every((_,j)=>S.t[n+"|"+i+"|"+j]);
 return `<li><label><input type="checkbox" data-all="${n}|${i}"${all?" checked":""}><span><b>${esc(tp.t)}</b></span></label><ul class="sub">${subs.map(([s,j])=>{const k=n+"|"+i+"|"+j,f=flag(s);return `<li><label><input type="checkbox" data-t="${k}"${S.t[k]?" checked":""}><span>${esc(nm(s))}</span>${f=="!"?'<small title="Often asked in interviews">🔥</small>':f=="~"?'<small title="Extra, probably not in the exam">✦</small>':""}</label></li>`}).join("")}</ul></li>`}
function card(n){const g=gOf(n),T=ids(n).length,d=done(n),p=Math.round(d/T*100),full=d===T,q=term.toLowerCase(),
 open=q&&JSON.stringify(CH[n][1]).toLowerCase().includes(q)?" open":"";
 return `<article class="card${full?" done":""}" data-n="${n}" style="--c:${g.c}"><div class="chead"><span class="num">${n.slice(1)}</span><h3><span class="bk">${BN[n[0]]}</span>${esc(CH[n][0])}</h3><span class="badge">${full?"Done":d?d+"/"+T:"Not started"}</span></div><div class="track"><div class="fill" style="width:${p}%"></div></div><details${open}><summary>${CH[n][1].length} topics · ${T} items</summary><ul>${CH[n][1].map((tp,i)=>li(n,i,tp)).join("")}</ul></details><div class="foot">${PG[n]?link(n):'<span style="color:var(--mute)">No notes yet</span>'}</div></article>`}
function match(n){const q=term.toLowerCase();return inBk(n)&&(!q||(CH[n][0]+JSON.stringify(CH[n][1])+gOf(n).n).toLowerCase().includes(q))}
function render(){let html="";
 if(view=="topic")GROUPS.forEach(g=>{const list=g.ch.filter(match);if(!list.length)return;
  const tot=list.reduce((a,n)=>a+ids(n).length,0),dn=list.reduce((a,n)=>a+done(n),0),p=Math.round(dn/tot*100);
  html+=`<section class="group" style="--c:${g.c}"><div class="ghead"><div class="gicon">${g.i}</div><div><h2>${g.n}</h2><small>${g.d}</small></div><div class="gmeter">${dn}/${tot} items · ${p}%<div class="track"><div class="fill" style="width:${p}%"></div></div></div></div><div class="grid">${list.map(card).join("")}</div></section>`});
 else{const l=ALL.filter(match);html=l.length?`<div class="grid">${l.map(card).join("")}</div>`:""}
 $("out").innerHTML=html||'<div class="empty">Nothing matches. Try a shorter word.</div>';stats()}
function stats(){const all=ALL.filter(inBk),tot=all.reduce((a,n)=>a+ids(n).length,0),dn=all.reduce((a,n)=>a+done(n),0),p=Math.round(dn/tot*100);
 const labs=all.flatMap(n=>CH[n][1].map((t,i)=>[n+"|"+i,t.t])).filter(x=>isLab(x[1]));
 $("pct").textContent=p+"%";$("ringArc").style.strokeDashoffset=402-402*p/100;
 $("sCh").textContent=all.filter(n=>done(n)===ids(n).length).length+"/"+all.length;$("sTop").textContent=dn+"/"+tot;
 $("sLab").textContent=labs.filter(x=>S.t[x[0]]).length+"/"+labs.length;$("sFile").textContent=all.filter(n=>PG[n]).length+"/"+all.length;
 const nx=all.find(n=>done(n)<ids(n).length);
 $("next").innerHTML=nx?`<div><b>Up next: ${BN[nx[0]]} Chapter ${nx.slice(1)}, ${esc(CH[nx][0])}</b><br><span style="color:var(--mute)">${ids(nx).length-done(nx)} items left in ${esc(gOf(nx).n)}</span></div>${PG[nx]?`<a class="btn" href="chapters/${PG[nx][0]}.html">Open notes</a>`:""}`:"<b>Everything is ticked. Retake the labs without notes.</b>"}
document.addEventListener("change",e=>{const t=e.target.dataset.t,a=e.target.dataset.all;
 if(t){e.target.checked?S.t[t]=1:delete S.t[t]}
 else if(a){const[n,i]=a.split("|");CH[n][1][i].s.forEach((_,j)=>{const k=n+"|"+i+"|"+j;e.target.checked?S.t[k]=1:delete S.t[k]})}else return;
 save();const open=[...document.querySelectorAll("details[open]")].map(d=>d.closest(".card").dataset.n);render();
 document.querySelectorAll(".card").forEach(c=>{if(open.includes(c.dataset.n))c.querySelector("details").open=true})});
const pr=(g,b)=>g.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));
$("tv").onclick=e=>{const b=e.target.closest("button");if(b){view=b.dataset.v;pr($("tv"),b);render()}};
$("tb").onclick=e=>{const b=e.target.closest("button");if(b){bk=b.dataset.b;pr($("tb"),b);render()}};
$("tj").onclick=e=>{hot=!hot;e.target.setAttribute("aria-pressed",hot);render()};
$("tx").onclick=e=>{hx=!hx;e.target.setAttribute("aria-pressed",hx);render()};
$("q").oninput=e=>{term=e.target.value.trim();render()};
$("rst").onclick=()=>{if(confirm("Clear all progress?")){S={t:{}};save();render()}};
$("exp").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="rhcsa-progress.json";a.click()};
$("imp").onclick=()=>{const i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=()=>i.files[0].text().then(x=>{try{S=Object.assign({t:{}},JSON.parse(x));save();render()}catch(e){alert("Not a valid progress file.")}});i.click()};
render();
</script>
